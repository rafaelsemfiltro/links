name: Deploy GitHub Pages (Custom)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare minimal pages output
        run: |
          mkdir _pages_out
          cp copa-barra-sul-dev.html _pages_out/
          cp copa-barra-sul.html _pages_out/
          cp .nojekyll _pages_out/
          cp index.html _pages_out/ 2>/dev/null || true
          cp crm-whatsapp.html _pages_out/ 2>/dev/null || true
          cp manifest.json _pages_out/ 2>/dev/null || true
          cp icon.svg _pages_out/ 2>/dev/null || true
          cp sw.js _pages_out/ 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_pages_out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
