<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rafael Versutti — Links</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #0f0f0f; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .page { max-width: 480px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: #1e1e1e; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 500; color: #aaa; }
  .name { font-size: 20px; font-weight: 500; color: #fff; }
  .bio { font-size: 14px; color: #888; text-align: center; max-width: 300px; line-height: 1.5; }
  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .link-card { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 14px; text-decoration: none; }
  .link-card:hover { background: #222; }
  .link-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .icon-booking { background: #003580; color: #fff; }
  .icon-pdf { background: #1a1a2e; border: 1px solid #d4a843; color: #d4a843; }
  .link-text { flex: 1; }
  .link-title { font-size: 15px; font-weight: 500; color: #fff; }
  .link-desc { font-size: 12px; color: #888; margin-top: 2px; }
  .arrow { color: #555; font-size: 18px; }
</style>
</head>
<body>
<div class="page">
  <div class="avatar">RV</div>
  <p class="name">Rafael Versutti</p>
  <p class="bio">Dicas de viagem, guias e hospedagens para o turista esperto ✈️</p>
  <div class="links">
    <a class="link-card" href="#">
      <div class="link-icon icon-booking">🛏</div>
      <div class="link-text">
        <p class="link-title">Booking.com — Afiliado</p>
        <p class="link-desc">Encontre as melhores hospedagens</p>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="link-card" href="#">
      <div class="link-icon icon-pdf">📖</div>
      <div class="link-text">
        <p class="link-title">Manual do Turista Esperto</p>
        <p class="link-desc">Guia completo — evite golpes e erros</p>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</div>
</body>
</html>
