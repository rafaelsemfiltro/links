<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa das Vendas 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0a0e1a;--navy2:#0f1525;--navy3:#141c2e;
  --gold:#D4AF37;--gold2:#FFD700;--gold3:#b8960c;--gold4:#8a6e00;
  --purple:#9b59b6;--purple-d:#4a1570;
  --orange:#e67e22;--orange-d:#7a3000;
  --emerald:#27ae60;--emerald-d:#0a4a1a;
  --goldstk:#D4AF37;--goldstk-d:#6b4700;
}
body{font-family:'Inter',sans-serif;background:var(--navy);color:#fff;overflow-x:hidden;min-height:100vh}

/* ═══ TOPBAR ═══════════════════════════════════════════ */
.topbar{
  background:rgba(10,14,26,.97);border-bottom:2px solid var(--gold3);
  padding:12px 20px;position:sticky;top:0;z-index:200;backdrop-filter:blur(10px);
}
.topbar-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.t-logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.t-logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--gold2),var(--gold3));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 14px rgba(212,175,55,.4);flex-shrink:0}
.t-title{font-family:'Bebas Neue',cursive;color:var(--gold2);font-size:clamp(17px,3.5vw,26px);letter-spacing:3px;line-height:1}
.t-sub{font-family:'Oswald',sans-serif;color:rgba(255,255,255,.35);font-size:9px;letter-spacing:3px;text-transform:uppercase}
.ghost-btn{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.3);color:var(--gold2);padding:8px 14px;border-radius:6px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:all .2s;white-space:nowrap}
.ghost-btn:hover{background:rgba(212,175,55,.2);border-color:var(--gold)}
.btn-gold{background:linear-gradient(135deg,var(--gold3),var(--gold2));border:none;border-radius:6px;padding:9px 18px;color:var(--navy);font-family:'Bebas Neue',cursive;font-size:14px;letter-spacing:2px;cursor:pointer;transition:all .2s}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(212,175,55,.35)}
.btn-danger{background:rgba(180,30,30,.18);border:1px solid rgba(180,30,30,.4);border-radius:6px;padding:7px 14px;color:#ff6b6b;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .2s}
.btn-danger:hover{background:rgba(180,30,30,.35)}

/* ═══ HOME ════════════════════════════════════════════ */
#homeView{padding:30px 20px;max-width:1400px;margin:0 auto}
.home-header{text-align:center;margin-bottom:36px}
.home-title{font-family:'Bebas Neue',cursive;font-size:clamp(42px,9vw,90px);background:linear-gradient(135deg,var(--gold2),var(--gold),var(--gold3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:6px;line-height:1}
.home-sub{font-family:'Oswald',sans-serif;color:rgba(255,255,255,.38);font-size:12px;letter-spacing:4px;text-transform:uppercase;margin-top:6px}
.sec-title{font-family:'Bebas Neue',cursive;font-size:14px;letter-spacing:3px;color:var(--gold2);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.3),transparent)}
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:14px}
.player-card{background:linear-gradient(160deg,var(--navy3),#0f1825);border:1px solid rgba(212,175,55,.18);border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.player-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold3),transparent)}
.player-card:hover{transform:translateY(-6px);border-color:rgba(212,175,55,.5);box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 20px rgba(212,175,55,.1)}
.pc-camisa{position:absolute;top:8px;right:10px;font-family:'Bebas Neue',cursive;font-size:15px;color:rgba(212,175,55,.4)}
.pc-av{width:70px;height:70px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:22px;color:var(--navy);background:linear-gradient(135deg,var(--gold2),var(--gold3));overflow:hidden;border:3px solid rgba(212,175,55,.4);box-shadow:0 0 18px rgba(212,175,55,.2)}
.pc-av img{width:100%;height:100%;object-fit:cover}
.pc-name{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;color:#fff;margin-bottom:3px}
.pc-cargo{font-size:9px;color:rgba(255,255,255,.38);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.pc-pts{font-family:'Bebas Neue',cursive;font-size:34px;color:var(--gold2);line-height:1}
.pc-pts-lbl{font-size:9px;color:rgba(255,255,255,.28);letter-spacing:1px;text-transform:uppercase}
.pc-prog{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin:8px 0 5px;overflow:hidden}
.pc-prog-fill{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));border-radius:2px;transition:width .8s}
.pc-figs-row{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:4px}
.pc-fig-tag{font-size:8px;padding:2px 6px;border-radius:10px;font-family:'Oswald',sans-serif;font-weight:600}

/* ═══ ALBUM VIEW ══════════════════════════════════════ */
#albumView{display:none;min-height:100vh;position:relative}
.album-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(0,50,20,.22) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 10% 80%,rgba(0,20,80,.18) 0%,transparent 50%),var(--navy);z-index:-1}
.album-bg::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 58px,rgba(255,255,255,.012) 58px,rgba(255,255,255,.012) 59px),repeating-linear-gradient(90deg,transparent,transparent 58px,rgba(255,255,255,.012) 58px,rgba(255,255,255,.012) 59px)}
.album-topbar{background:rgba(10,14,26,.96);border-bottom:2px solid rgba(212,175,55,.28);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(10px)}
.alb-badge{display:flex;align-items:center;gap:10px}
.alb-badge-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--gold2),var(--gold3));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 10px rgba(212,175,55,.4)}
.alb-badge-name{font-family:'Bebas Neue',cursive;color:var(--gold2);font-size:17px;letter-spacing:3px}
.alb-badge-sub{font-family:'Oswald',sans-serif;color:rgba(255,255,255,.35);font-size:9px;letter-spacing:2px;text-transform:uppercase}
.album-content{max-width:1440px;margin:0 auto;padding:18px 16px 44px}

/* 3-COLUMN TOP */
.al-grid-top{display:grid;grid-template-columns:320px 1fr 270px;gap:14px;margin-bottom:14px}
@media(max-width:1080px){.al-grid-top{grid-template-columns:290px 1fr 240px}}
@media(max-width:780px){.al-grid-top{grid-template-columns:1fr}}

/* 2-COLUMN BOTTOM */
.al-grid-bot{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:780px){.al-grid-bot{grid-template-columns:1fr}}

/* panel base */
.panel{background:linear-gradient(160deg,rgba(20,28,46,.96),rgba(10,14,26,.98));border:1px solid rgba(212,175,55,.2);border-radius:12px;position:relative;overflow:hidden}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold3),transparent)}
.p-head{padding:13px 16px 10px;border-bottom:1px solid rgba(212,175,55,.1);display:flex;align-items:center;gap:8px}
.p-title{font-family:'Bebas Neue',cursive;font-size:14px;letter-spacing:3px;color:var(--gold2)}
.p-body{padding:14px}
.star-title{font-family:'Bebas Neue',cursive;font-size:13px;letter-spacing:2px;color:var(--gold2);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px}
.star-title::before,.star-title::after{content:'★';color:var(--gold3);font-size:10px}

/* ═══ COL 1: PLAYER HERO ══════════════════════════════ */
.col-hero{background:linear-gradient(160deg,rgba(10,14,30,.99),rgba(15,20,42,.97));border:1px solid rgba(212,175,55,.25);border-radius:12px;position:relative;overflow:hidden;padding:18px 16px 20px}
.col-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--gold3))}
.hero-copa{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.hero-copa-icon{width:26px;height:26px;background:linear-gradient(135deg,var(--gold2),var(--gold3));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.hero-copa-txt{font-family:'Bebas Neue',cursive;color:var(--gold2);font-size:12px;letter-spacing:3px}

/* circular photo */
.hero-photo-wrap{width:150px;height:150px;border-radius:50%;margin:0 auto 14px;position:relative;cursor:pointer}
.hero-photo-wrap:hover .hero-photo-ov{opacity:1}
.hero-photo-ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--gold2),var(--gold3),var(--gold2),var(--gold3),var(--gold2));padding:3px;box-shadow:0 0 28px rgba(212,175,55,.4),0 0 60px rgba(212,175,55,.08)}
.hero-photo-inner{width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,#1a2040,#0a0e1a);overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-photo-inner img{width:100%;height:100%;object-fit:cover}
.hero-photo-init{font-family:'Bebas Neue',cursive;font-size:48px;color:var(--gold2);opacity:.7}
.hero-photo-ov{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;font-size:22px}
input#photoFile{display:none}
.hero-camisa-badge{position:absolute;top:-2px;right:-2px;width:36px;height:36px;background:linear-gradient(135deg,var(--gold2),var(--gold3));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:15px;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.5);border:2px solid var(--navy)}

.hero-name{font-family:'Bebas Neue',cursive;font-size:clamp(38px,5.5vw,62px);color:#fff;text-align:center;line-height:.92;letter-spacing:3px;text-shadow:0 2px 18px rgba(0,0,0,.5);margin-bottom:5px}
.hero-subtitle{font-family:'Oswald',sans-serif;font-size:10px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:14px}

/* info pills */
.hero-pills{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:14px}
.hero-pill{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.22);border-radius:20px;padding:4px 10px;font-family:'Inter',sans-serif;font-size:10px;color:rgba(255,255,255,.78);display:flex;align-items:center;gap:4px}
.hero-pill-icon{color:var(--gold);font-size:10px}
.hero-lema{background:rgba(212,175,55,.06);border-left:2px solid var(--gold);padding:7px 10px;border-radius:0 6px 6px 0;font-family:'Oswald',sans-serif;font-size:10px;color:rgba(212,175,55,.8);font-style:italic;margin-bottom:12px;line-height:1.4}

/* progress */
.prog-wrap{margin-bottom:12px}
.prog-label{font-family:'Oswald',sans-serif;font-size:9px;color:rgba(255,255,255,.38);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between}
.prog-track{background:rgba(255,255,255,.05);border-radius:4px;height:6px;overflow:hidden;border:1px solid rgba(212,175,55,.1)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));border-radius:4px;transition:width .8s ease;box-shadow:0 0 8px rgba(255,215,0,.2)}

/* desempenho */
.hero-desemp{background:rgba(0,0,0,.28);border:1px solid rgba(212,175,55,.15);border-radius:8px;padding:12px}
.desemp-title{font-family:'Bebas Neue',cursive;font-size:11px;letter-spacing:2px;color:rgba(212,175,55,.65);text-align:center;margin-bottom:8px}
.desemp-gols{text-align:center;margin-bottom:8px}
.desemp-num{font-family:'Bebas Neue',cursive;font-size:50px;color:var(--gold2);line-height:1;text-shadow:0 0 18px rgba(255,215,0,.28)}
.desemp-lbl{font-family:'Oswald',sans-serif;font-size:9px;color:rgba(255,255,255,.38);letter-spacing:2px;text-transform:uppercase}
.desemp-stars{display:flex;justify-content:center;gap:4px;margin-top:6px}
.d-star{font-size:17px;transition:.2s}
.d-star.on{color:var(--gold2);filter:drop-shadow(0 0 5px rgba(255,215,0,.5))}
.d-star.off{color:rgba(255,255,255,.12)}

/* ═══ COL 2: STICKER GRID ════════════════════════════ */
.col-figs{display:flex;flex-direction:column;gap:12px}
.figs-panel{background:linear-gradient(160deg,rgba(20,28,46,.96),rgba(10,14,26,.98));border:1px solid rgba(212,175,55,.2);border-radius:12px;padding:14px;position:relative}
.figs-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold3),transparent)}
.stickers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* physical sticker slot */
.sticker-slot{aspect-ratio:2/3;position:relative;border-radius:6px}
.sticker-inner{width:100%;height:100%;border-radius:6px;position:relative;overflow:hidden;border:2px solid;transition:all .3s}
.sticker-slot.empty .sticker-inner{background:linear-gradient(160deg,#070b18,#0c1128);border-color:rgba(212,175,55,.22);border-style:dashed}
.sticker-slot.empty:hover .sticker-inner{border-color:rgba(212,175,55,.5);box-shadow:0 0 12px rgba(212,175,55,.1);cursor:pointer}
.stk-corner{position:absolute;width:10px;height:10px;background:var(--gold3);opacity:.5;z-index:3}
.stk-corner.tl{top:0;left:0;clip-path:polygon(0 0,100% 0,0 100%)}
.stk-corner.tr{top:0;right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.stk-corner.bl{bottom:0;left:0;clip-path:polygon(0 0,0 100%,100% 100%)}
.stk-corner.br{bottom:0;right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.stk-num{position:absolute;top:4px;left:6px;font-family:'Bebas Neue',cursive;font-size:12px;color:rgba(212,175,55,.3);z-index:2}
.stk-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;pointer-events:none}
.stk-placeholder-icon{font-size:18px;opacity:.25}
.stk-placeholder-txt{font-family:'Oswald',sans-serif;font-size:7px;letter-spacing:1.5px;color:rgba(212,175,55,.28);text-transform:uppercase;text-align:center;line-height:1.5}
.sticker-slot.filled .sticker-inner{border-style:solid}
.stk-fill-bg{position:absolute;inset:0;display:flex;flex-direction:column}
.stk-type-bar{height:4px;flex-shrink:0}
.stk-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;gap:3px}
.stk-emoji{font-size:22px}
.stk-tipo{font-family:'Bebas Neue',cursive;font-size:13px;letter-spacing:2px}
.stk-semana{font-family:'Oswald',sans-serif;font-size:7.5px;color:rgba(255,255,255,.45);letter-spacing:.5px}
.stk-pts{font-family:'Bebas Neue',cursive;font-size:16px;color:rgba(255,255,255,.9)}
.stk-pts-lbl{font-size:6.5px;color:rgba(255,255,255,.38);font-family:'Oswald',sans-serif;letter-spacing:.8px;text-transform:uppercase}

@keyframes stickerPaste{
  0%{transform:scale(1.5) rotate(-8deg);opacity:0;filter:blur(4px)}
  60%{transform:scale(1.05) rotate(2deg);filter:blur(0)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.sticker-slot.just-pasted .sticker-inner{animation:stickerPaste .45s cubic-bezier(.175,.885,.32,1.275) forwards}

.quote-bar{background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.18);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:9px 14px;font-family:'Oswald',sans-serif;font-size:11px;color:rgba(212,175,55,.8);font-style:italic;text-align:center}

/* achievements */
.achiev-grid{display:flex;flex-wrap:wrap;gap:5px}
.achiev-badge{display:flex;align-items:center;gap:4px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);border-radius:20px;padding:4px 9px;font-family:'Inter',sans-serif;font-size:9px;color:rgba(255,255,255,.75)}
.achiev-badge.locked{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.07);color:rgba(255,255,255,.22);filter:grayscale(1)}
.achiev-icon{font-size:13px}

/* ═══ COL 3: DESTAQUES ════════════════════════════════ */
.col-dest{display:flex;flex-direction:column;gap:12px}
.dest-player-card{background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.18);border-radius:8px;padding:10px;display:flex;align-items:center;gap:9px}
.dest-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold3));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:15px;color:var(--navy);flex-shrink:0;overflow:hidden}
.dest-av img{width:100%;height:100%;object-fit:cover}
.dest-player-name{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;color:#fff}
.dest-player-meta{font-size:9px;color:rgba(255,255,255,.38);letter-spacing:.5px}
.dest-player-pts{font-family:'Bebas Neue',cursive;font-size:22px;color:var(--gold2);margin-left:auto}

.checklist-item{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-family:'Inter',sans-serif;font-size:10px;color:rgba(255,255,255,.7)}
.checklist-item:last-child{border-bottom:none}
.check-icon{width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold3));display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--navy);flex-shrink:0}

.trophy-box{text-align:center;padding:14px;background:rgba(0,0,0,.2);border:1px solid rgba(212,175,55,.15);border-radius:10px}
.trophy-css{font-size:44px;filter:drop-shadow(0 0 10px rgba(212,175,55,.5));display:block;margin-bottom:7px}
.trophy-text{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(212,175,55,.65);line-height:1.7}

.type-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.type-row:last-child{border-bottom:none}
.type-row-left{display:flex;align-items:center;gap:6px;font-family:'Oswald',sans-serif;font-size:11px}
.type-row-count{font-family:'Bebas Neue',cursive;font-size:17px}

/* ═══ BOTTOM LEFT: CONQUISTAS ═════════════════════════ */
.conq-stickers-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.traj-title{font-family:'Bebas Neue',cursive;font-size:12px;letter-spacing:2px;color:var(--gold2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.traj-title::before,.traj-title::after{content:'★';color:var(--gold3);font-size:9px}
.traj-line{display:flex;align-items:flex-start;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:rgba(212,175,55,.2) transparent}
.traj-step{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:62px}
.traj-dot{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold3),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 0 8px rgba(212,175,55,.3);border:2px solid var(--gold2);position:relative;z-index:2}
.traj-label{font-family:'Oswald',sans-serif;font-size:7px;letter-spacing:.5px;color:rgba(255,255,255,.55);text-align:center;margin-top:5px;max-width:60px;text-transform:uppercase;line-height:1.3}
.traj-connector{flex:1;min-width:16px;height:2px;background:linear-gradient(90deg,var(--gold3),rgba(212,175,55,.2));margin-top:13px;flex-shrink:0}

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const KEY = 'copa_vendas_v3';
const SLOTS = 36;
const SEMANAS = 10;

const TYPES = {
  'Júnior': { pts:1, emoji:'⭐', color:'#27ae60', border:'#1a7a44', bg:'linear-gradient(160deg,#0a4a1a,#1a5c30)' },
  'Sênior': { pts:2, emoji:'🔥', color:'#e67e22', border:'#a05010', bg:'linear-gradient(160deg,#7a3000,#c25a10)' },
  'Master': { pts:3, emoji:'💎', color:'#9b59b6', border:'#6a2090', bg:'linear-gradient(160deg,#4a1570,#7a2ab0)' },
  'Bônus':  { pts:5, emoji:'🏆', color:'#D4AF37', border:'#9a7a10', bg:'linear-gradient(160deg,#6b4700,#b07a00)' },
};

const ACHIEVEMENTS = [
  { icon:'🏅', name:'Estreia',      desc:'1ª figurinha',         ok:v=>v.figurinhas.length>=1 },
  { icon:'📖', name:'Caderneta',    desc:'5 figurinhas',          ok:v=>v.figurinhas.length>=5 },
  { icon:'🔥', name:'Em Chamas',    desc:'10 figurinhas',         ok:v=>v.figurinhas.length>=10 },
  { icon:'⚡', name:'Metade',       desc:'18 figurinhas',         ok:v=>v.figurinhas.length>=18 },
  { icon:'💫', name:'Quase Lá',     desc:'30 figurinhas',         ok:v=>v.figurinhas.length>=30 },
  { icon:'🏆', name:'Campeão',      desc:'Álbum completo!',       ok:v=>v.figurinhas.length>=SLOTS },
  { icon:'🎯', name:'Bônus Hunter', desc:'Figurinha Bônus',       ok:v=>v.figurinhas.some(f=>f.tipo==='Bônus') },
  { icon:'💎', name:'Master Class', desc:'Figurinha Master',      ok:v=>v.figurinhas.some(f=>f.tipo==='Master') },
  { icon:'👑', name:'Elite',        desc:'50+ pontos',            ok:v=>calcPts(v)>=50 },
];

const CHECKLIST = ['Atitude Campeã','Foco em Resultados','Trabalho em Equipe','Superação Diária','Excelência no Atendimento'];

const TRAJ = [
  { icon:'🎯', label:'FOCO NO INÍCIO' },
  { icon:'💪', label:'TREINO DIÁRIO' },
  { icon:'🔒', label:'DISCIPLINA SEMPRE' },
  { icon:'📈', label:'RESULTADOS CONSTANTES' },
  { icon:'👑', label:'CRAQUE DA COPA' },
];

const ESTAT_CATS = ['Dedicação','Resultados','Trabalho em Equipe','Comunicação','Liderança'];

const QUOTES = [
  '"Cada figurinha é uma vitória conquistada com suor e determinação."',
  '"O álbum completo representa a jornada de um verdadeiro campeão."',
  '"Campeões são feitos de pequenas vitórias diárias."',
  '"Na Copa das Vendas, todo dia é jogo e cada cliente é um gol!"',
  '"A excelência não é um ato, é um hábito de campeões."',
];

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let S = null;
let loggedIn = false;
let curView = 'home';
let curVendorId = null;
let addStkTarget = null;
let curType = 'Júnior';

function initState() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
  if (!S || !S.vendedores) {
    S = {
      senha: 'gerente123',
      vendedores: [
        { id:1, nome:'Ana Souza',       cargo:'Consultora Senior',  camisa:10, foto:null, lema:'Foco total em cada cliente!',        figurinhas:[] },
        { id:2, nome:'Carlos Lima',     cargo:'Consultor Pleno',    camisa:7,  foto:null, lema:'Resultados são meu combustível!',    figurinhas:[] },
        { id:3, nome:'Fernanda Costa',  cargo:'Consultora Master',  camisa:1,  foto:null, lema:'Excelência em cada atendimento!',    figurinhas:[] },
        { id:4, nome:'Rafael Santos',   cargo:'Consultor Junior',   camisa:9,  foto:null, lema:'Aprendendo e crescendo todo dia!',   figurinhas:[] },
        { id:5, nome:'Juliana Pereira', cargo:'Consultora Pleno',   camisa:11, foto:null, lema:'Cada dia é uma nova oportunidade!',  figurinhas:[] },
      ],
      historico: [],
    };
    save();
  }
}

function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function calcPts(v) {
  return v.figurinhas.reduce((s,f) => s + (TYPES[f.tipo]?.pts||0), 0);
}
function ranked() {
  return [...S.vendedores].sort((a,b) => calcPts(b) - calcPts(a));
}
function initials(nome) {
  return nome.split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase();
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}
function calcStars(v) {
  const p = calcPts(v);
  if(p>=50) return 5; if(p>=30) return 4; if(p>=15) return 3; if(p>=5) return 2; if(p>=1) return 1;
  return 0;
}
function calcEstat(v, cat) {
  const f = v.figurinhas.length, p = calcPts(v);
  switch(cat) {
    case 'Dedicação':           return Math.min(5, Math.floor(f/4)+1);
    case 'Resultados':          return Math.min(5, Math.floor(p/8)+1);
    case 'Trabalho em Equipe':  return Math.min(5, f>0 ? 3 : 1);
    case 'Comunicação':         return Math.min(5, Math.floor(f/5)+2);
    case 'Liderança':           return Math.min(5, Math.floor(p/10)+1);
    default:                    return 2;
  }
}
function starsRow(count, max=5, onCls='d-star on', offCls='d-star off') {
  let h='';
  for(let i=1;i<=max;i++) h+=`<span class="${i<=count?onCls:offCls}">★</span>`;
  return h;
}
function avatarHTML(v, size='large') {
  const dim = size==='sm' ? 'width:36px;height:36px;font-size:13px' : 'width:42px;height:42px;font-size:15px';
  return v.foto
    ? `<div class="${size==='sm'?'vr-av':'dest-av'}" style="${dim}"><img src="${v.foto}" alt="${v.nome}"></div>`
    : `<div class="${size==='sm'?'vr-av':'dest-av'}" style="${dim}">${initials(v.nome)}</div>`;
}

function toast(msg, dur=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), dur);
}

function confetti() {
  const colors=['#D4AF37','#FFD700','#fff','#9b59b6','#e67e22','#27ae60','#ff6b6b'];
  for(let i=0;i<20;i++) {
    setTimeout(()=>{
      const p=document.createElement('div');
      p.className='confetti-p';
      p.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'0'};animation-duration:${1.5+Math.random()*1}s`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),2500);
    }, i*55);
  }
}

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

// ═══════════════════════════════════════════════════════════
// VIEW SWITCHERS
// ═══════════════════════════════════════════════════════════
function showHome(){
  curView='home';
  document.getElementById('homeView').style.display='';
  document.getElementById('albumView').style.display='none';
  document.getElementById('managerView').style.display='none';
  renderHome();
}
function showAlbum(vid){
  curVendorId=vid; curView='album';
  document.getElementById('homeView').style.display='none';
  document.getElementById('albumView').style.display='';
  document.getElementById('managerView').style.display='none';
  renderAlbum(vid);
}
function showManager(){
  curView='manager';
  document.getElementById('homeView').style.display='none';
  document.getElementById('albumView').style.display='none';
  document.getElementById('managerView').style.display='';
  renderManager();
}
function showMgrOrLogin(){
  if(loggedIn) { showManager(); return; }
  document.getElementById('pwInput').value='';
  document.getElementById('pwError').style.display='none';
  openModal('pwModal');
}
function doLogin(){
  if(document.getElementById('pwInput').value===S.senha){
    loggedIn=true; closeModal('pwModal'); showManager();
  } else {
    document.getElementById('pwError').style.display='block';
  }
}
function doLogout(){ loggedIn=false; showHome(); toast('Sessão encerrada'); }

// ═══════════════════════════════════════════════════════════
// RENDER HOME
// ═══════════════════════════════════════════════════════════
function renderHome(){
  const rnk=ranked();
  let html=`<div style="max-width:1400px;margin:0 auto;padding:30px 20px">
    <div class="home-header">
      <div class="home-title">COPA DAS VENDAS</div>
      <div class="home-sub">2026 ★ Álbum Oficial de Figurinhas ★</div>

function renderAlbum(vid){
  const v=S.vendedores.find(x=>x.id===vid);
  if(!v) return;

  const pts=calcPts(v), figs=v.figurinhas.length, pct=Math.round(figs/SLOTS*100);
  const stars=calcStars(v);
  const rnk=ranked(), rank=rnk.findIndex(x=>x.id===vid)+1;
  const top1=rnk[0];

  // weekly data
  const wk={};
  for(let s=1;s<=SEMANAS;s++) wk[s]={f:0,p:0};
  v.figurinhas.forEach(f=>{
    const s=parseInt(f.semana)||1;
    if(wk[s]){ wk[s].f++; wk[s].p+=(TYPES[f.tipo]?.pts||0); }
  });

  function stickerSlot(idx){
    const f=v.figurinhas[idx];
    const num=String(idx+1).padStart(2,'0');
    const corners=`<div class="stk-corner tl"></div><div class="stk-corner tr"></div><div class="stk-corner bl"></div><div class="stk-corner br"></div>`;
    if(f){
      const t=TYPES[f.tipo]||TYPES['Júnior'];
      return `<div class="sticker-slot filled" id="slot-${idx}">
        <div class="sticker-inner" style="border-color:${t.border}">
          <div class="stk-fill-bg" style="background:${t.bg}">
            <div class="stk-type-bar" style="background:${t.color}"></div>
            <div class="stk-body">
              <div class="stk-emoji">${t.emoji}</div>
              <div class="stk-tipo" style="color:${t.color}">${f.tipo.toUpperCase()}</div>
              <div class="stk-semana">Semana ${f.semana||1}</div>
              <div class="stk-pts">${t.pts}</div>
              <div class="stk-pts-lbl">pontos</div>
            </div>
          </div>
          <div class="stk-num">${num}</div>
          ${corners}
        </div>
      </div>`;
    }
    const onclick=loggedIn?`onclick="openAddSticker(${v.id})"`:'' ;
    return `<div class="sticker-slot empty" ${onclick}>
      <div class="sticker-inner">
        <div class="stk-num">${num}</div>
        <div class="stk-placeholder">
          <div class="stk-placeholder-icon">⊞</div>
          <div class="stk-placeholder-txt">COLE AQUI<br>SUA FIGURINHA</div>
        </div>
        ${corners}
      </div>
    </div>`;
  }

  let slots16=''; for(let i=0;i<6;i++) slots16+=stickerSlot(i);
  let slots79=''; for(let i=6;i<9;i++) slots79+=stickerSlot(i);

  // weekly table
  let tblRows='', totF=0, totP=0;
  for(let s=1;s<=SEMANAS;s++){
    const d=wk[s]; totF+=d.f; totP+=d.p;
    tblRows+=`<tr>
      <td>Semana ${s}</td>
      <td class="${d.f===0?'zero':''}">${d.f===0?'—':d.f}</td>
      <td class="${d.p===0?'zero':''}">${d.p===0?'—':d.p}</td>
    </tr>`;
  }
  tblRows+=`<tr class="total-row"><td>TOTAL GERAL</td><td>${totF}</td><td>${totP}</td></tr>`;

  // type counts
  const tCnt={};
  v.figurinhas.forEach(f=>{ tCnt[f.tipo]=(tCnt[f.tipo]||0)+1; });

  // achievements
  const achievHtml=ACHIEVEMENTS.map(a=>{
    const ok=a.ok(v);
    return `<div class="achiev-badge ${ok?'':'locked'}" title="${a.desc}"><span class="achiev-icon">${a.icon}</span><span>${a.name}</span></div>`;
  }).join('');

  // estat
  const estatHtml=ESTAT_CATS.map(cat=>{
    const val=calcEstat(v,cat);
    let sh=''; for(let i=1;i<=5;i++) sh+=`<span class="e-star ${i<=val?'on':'off'}">★</span>`;
    return `<div class="estat-row"><span class="estat-label">${cat}</span><div class="estat-stars">${sh}</div></div>`;
  }).join('');

  // trajectory
  const trajHtml=TRAJ.map((t,i)=>`
    ${i>0?'<div class="traj-connector"></div>':''}
    <div class="traj-step">
      <div class="traj-dot">${t.icon}</div>
      <div class="traj-label">${t.label}</div>
    </div>`).join('');

  const quote=QUOTES[vid%QUOTES.length];
  const addBtn=loggedIn?`<button class="btn-gold" style="width:100%;margin-top:12px;font-size:13px" onclick="openAddSticker(${v.id})">➕ COLAR FIGURINHA</button>`:'';
  const photoHtml=v.foto?`<img src="${v.foto}" alt="${v.nome}">`:`<div class="hero-photo-init">${initials(v.nome)}</div>`;
  const top1Av=top1.foto?`<img src="${top1.foto}">`:'';

      </div>

      <div class="hero-photo-wrap" onclick="${loggedIn?'triggerPhoto()':''}">
        <div class="hero-photo-ring">
          <div class="hero-photo-inner" id="heroPhotoInner">${photoHtml}</div>
        </div>
        <div class="hero-camisa-badge">#${v.camisa||rank}</div>
        ${loggedIn?'<div class="hero-photo-ov">📷</div>':''}
      </div>
      <input type="file" id="photoFile" accept="image/*" onchange="handlePhoto(event,${v.id})">

      <div class="hero-name">${v.nome}</div>
      <div class="hero-subtitle">★ O Craque da Copa das Vendas! ★</div>

      <div class="hero-pills">
        <div class="hero-pill"><span class="hero-pill-icon">🎽</span>${v.cargo}</div>
        <div class="hero-pill"><span class="hero-pill-icon">#</span>Camisa ${v.camisa||rank}</div>
        <div class="hero-pill"><span class="hero-pill-icon">🏅</span>${rank}° Lugar</div>
        <div class="hero-pill"><span class="hero-pill-icon">🎴</span>${figs} figurinhas</div>
      </div>
      ${v.lema?`<div class="hero-lema">"${v.lema}"</div>`:''}

      <div class="prog-wrap">
        <div class="prog-label"><span>Álbum</span><span>${figs}/${SLOTS} — ${pct}%</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>

      <div class="hero-desemp">
        <div class="desemp-title">★ DESEMPENHO ★</div>
        <div class="desemp-gols">
          <div class="desemp-num">${pts}</div>
          <div class="desemp-lbl">pontos conquistados</div>
        </div>
        <div class="desemp-stars">${starsRow(stars)}</div>
      </div>
      ${addBtn}
    </div>

    <!-- COL 2: FIGURINHAS -->
    <div class="col-figs">
      <div class="figs-panel">
        <div class="star-title">MINHAS FIGURINHAS</div>
        <div class="stickers-grid">${slots16}</div>
        ${figs>6?`<div style="text-align:center;margin-top:8px;font-family:'Oswald',sans-serif;font-size:9px;color:rgba(212,175,55,.45);letter-spacing:2px">+ MAIS ${figs-6} FIGURINHAS NO ÁLBUM</div>`:''}
      </div>
      <div class="quote-bar">${quote}</div>
      <div class="figs-panel" style="padding:13px">
        <div class="star-title" style="font-size:12px">CONQUISTAS</div>
        <div class="achiev-grid">${achievHtml}</div>
      </div>
    </div>

    <!-- COL 3: DESTAQUES -->
    <div class="col-dest">
      <div class="panel">
        <div class="p-head"><div class="p-title">★ CRAQUE DO MOMENTO ★</div></div>
        <div class="p-body">
          <div class="dest-player-card">
            ${top1Av?`<div class="dest-av"><img src="${top1.foto}"></div>`:`<div class="dest-av">${initials(top1.nome)}</div>`}
            <div>
              <div class="dest-player-name">${top1.nome}</div>
              <div class="dest-player-meta">${top1.cargo}</div>
            </div>
            <div class="dest-player-pts">${calcPts(top1)}</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="p-head"><div class="p-title">★ PERFIL CAMPEÃO ★</div></div>
        <div class="p-body">
          ${CHECKLIST.map(c=>`<div class="checklist-item"><div class="check-icon">✓</div><span>${c}</span></div>`).join('')}
        </div>
      </div>

      <div class="trophy-box">
        <span class="trophy-css">🏆</span>
        <div class="trophy-text">NA COPA DAS VENDAS,<br>CADA CONSULTOR É<br>UM CRAQUE!</div>
      </div>

      <div class="panel">
        <div class="p-head"><div class="p-title">★ TIPOS DE FIGURINHA ★</div></div>
        <div class="p-body">
          ${Object.entries(TYPES).map(([tipo,t])=>{
            const cnt=tCnt[tipo]||0;
            return `<div class="type-row">
              <div class="type-row-left"><span>${t.emoji}</span><span style="color:${t.color}">${tipo}</span></div>
              <div class="type-row-count" style="color:${cnt>0?t.color:'rgba(255,255,255,.2)'}">${cnt}</div>

  </div>

  <!-- 2 COLUMNS BOTTOM -->
  <div class="al-grid-bot">

    <!-- BOTTOM LEFT: CONQUISTAS + TRAJETÓRIA -->
    <div class="panel">
      <div class="p-head"><div class="p-title">★ FIGURINHAS 07 – 09 ★</div></div>
      <div class="p-body">

    <!-- BOTTOM RIGHT: MEUS GOLS -->
    <div class="panel">
      <div class="p-head"><div class="p-title">★ MEUS GOLS ★</div></div>
      <div class="p-body">

          <div class="total-gols-num">${pts}</div>
          <div class="total-gols-lbl">Total de Gols (Pontos)</div>
        </div>
        <div style="font-family:'Bebas Neue',cursive;font-size:12px;letter-spacing:2px;color:var(--gold2);margin-bottom:7px;display:flex;align-items:center;gap:6px">
          <span>★</span> RESULTADOS POR SEMANA <span>★</span>
        </div>
        <table class="gols-table">
          <thead><tr><th>Período</th><th>Figurinhas</th><th>Pontos</th></tr></thead>
          <tbody>${tblRows}</tbody>
        </table>
        <div style="font-family:'Bebas Neue',cursive;font-size:12px;letter-spacing:2px;color:var(--gold2);margin-bottom:8px;display:flex;align-items:center;gap:6px">
          <span>★</span> MINHAS ESTATÍSTICAS <span>★</span>

  document.getElementById('albumContent').innerHTML=html;
}

function triggerPhoto(){
  const f=document.getElementById('photoFile');
  if(f) f.click();
}
function handlePhoto(e, vid){
  const file=e.target.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    const v=S.vendedores.find(x=>x.id===vid);
    if(v){ v.foto=ev.target.result; save(); renderAlbum(vid); toast('📸 Foto atualizada!'); }
  };
  r.readAsDataURL(file);
}

// ADD STICKER
// ═══════════════════════════════════════════════════════════
function openAddSticker(vid){
  if(!loggedIn){ toast('Faça login como gerente para adicionar figurinhas'); return; }
  addStkTarget=vid;
  const v=S.vendedores.find(x=>x.id===vid);
  document.getElementById('addStkVendorName').textContent=v?v.nome:'';

  let btns='';
  Object.entries(TYPES).forEach(([t,d])=>{
    btns+=`<div class="type-btn ${curType===t?'sel':''}"
      style="background:${d.bg};border-color:${d.border};color:${d.color}"
      onclick="selType('${t}')">${d.emoji}<br>${t}</div>`;
  });
  document.getElementById('typeBtns').innerHTML=btns;

  const wkNum=Math.min(10,Math.ceil((new Date()-new Date(new Date().getFullYear(),0,1))/(7*86400000)));
  document.getElementById('addStkSemana').value=wkNum||1;
  document.getElementById('addStkQtd').value=1;
  openModal('addStkModal');
}

function selType(t){
  curType=t;
  let btns='';
  Object.entries(TYPES).forEach(([t2,d])=>{
    btns+=`<div class="type-btn ${curType===t2?'sel':''}"
      style="background:${d.bg};border-color:${d.border};color:${d.color}"
      onclick="selType('${t2}')">${d.emoji}<br>${t2}</div>`;
  });
  document.getElementById('typeBtns').innerHTML=btns;
}

function confirmAddSticker(){
  if(!addStkTarget) return;
  const v=S.vendedores.find(x=>x.id===addStkTarget);
  if(!v) return;
  const tipo=curType;
  const semana=parseInt(document.getElementById('addStkSemana').value)||1;
  const qtd=parseInt(document.getElementById('addStkQtd').value)||1;
  const remaining=SLOTS-v.figurinhas.length;
  const toAdd=Math.min(qtd,remaining);
  if(toAdd<=0){ toast('Álbum já completo!'); closeModal('addStkModal'); return; }

  const now=new Date().toISOString();
  const firstIdx=v.figurinhas.length;
  for(let i=0;i<toAdd;i++) v.figurinhas.push({tipo,data:now,semana});
  S.historico.push({vendedorId:v.id,vendedorNome:v.nome,tipo,qtd:toAdd,data:now,semana});
  save();
  closeModal('addStkModal');

  if(v.figurinhas.length>=SLOTS){ confetti(); toast(`🏆 ${v.nome} COMPLETOU O ÁLBUM!`,4500); }
  else { toast(`${TYPES[tipo].emoji} ${toAdd} figurinha(s) ${tipo} colada(s)!`); }

  if(curView==='album'&&curVendorId===addStkTarget){
    renderAlbum(addStkTarget);
    setTimeout(()=>{
      const el=document.getElementById(`slot-${firstIdx}`);
      if(el) el.classList.add('just-pasted');
    },50);
  } else if(curView==='home'){ renderHome(); }
}

function addVendedor(){
  const nome=(document.getElementById('newNome').value||'').trim();
  const cargo=(document.getElementById('newCargo').value||'').trim();
  const camisa=parseInt(document.getElementById('newCamisa').value)||null;
  const lema=(document.getElementById('newLema').value||'').trim();
  if(!nome){ toast('Digite o nome do vendedor'); return; }
  S.vendedores.push({id:Date.now(),nome,cargo:cargo||'Consultor(a)',camisa,foto:null,lema,figurinhas:[]});
  save(); renderManager(); toast(`✅ ${nome} adicionado(a)!`);
}

function removeVendedor(id){
  if(!confirm('Remover este vendedor e todas as suas figurinhas?')) return;
  S.vendedores=S.vendedores.filter(v=>v.id!==id);
  S.historico=S.historico.filter(h=>h.vendedorId!==id);
  save(); renderManager(); toast('Vendedor removido');
}

function mgrAddSticker(){
  const vid=parseInt(document.getElementById('mgrStkVendor').value);
  const tipo=document.getElementById('mgrStkTipo').value;
  const semana=parseInt(document.getElementById('mgrStkSemana').value)||1;
  const qtd=parseInt(document.getElementById('mgrStkQtd').value)||1;
  const v=S.vendedores.find(x=>x.id===vid);
  if(!v) return;
  const remaining=SLOTS-v.figurinhas.length;
  const toAdd=Math.min(qtd,remaining);
  if(toAdd<=0){ toast('Álbum deste vendedor já está completo!'); return; }
  const now=new Date().toISOString();
  for(let i=0;i<toAdd;i++) v.figurinhas.push({tipo,data:now,semana});
  S.historico.push({vendedorId:v.id,vendedorNome:v.nome,tipo,qtd:toAdd,data:now,semana});
  save(); renderManager();
  if(v.figurinhas.length>=SLOTS){ confetti(); toast(`🏆 ${v.nome} completou o álbum!`,4500); }
  else { toast(`${TYPES[tipo].emoji} ${toAdd} figurinha(s) para ${v.nome}!`); }
}

function saveNewPw(){
  const np=(document.getElementById('newPwInp').value||'');
  const cp=(document.getElementById('confirmPwInp').value||'');
  const err=document.getElementById('pwChangeErr');
  if(!np){ err.style.display='block'; err.textContent='Digite a nova senha'; return; }
  if(np!==cp){ err.style.display='block'; err.textContent='Senhas não coincidem'; return; }
  S.senha=np; save(); closeModal('changePwModal'); toast('🔑 Senha alterada!');
}

function resetAll(){
  if(!confirm('ATENÇÃO: Isso apagará TODOS os dados. Confirmar?')) return;
  localStorage.removeItem(KEY);
  loggedIn=false;
  initState(); showHome(); toast('Dados resetados');
}

// BOOT
initState();
showHome();
</script>
